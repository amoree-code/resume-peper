name: Sync Resume to Google Drive
on:
  push:
    branches:
      - main

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Typst to compile your .typ file
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      # 2. Compile main.typ into resume.pdf
      - name: Generate PDF
        run: typst compile main.typ resume.pdf

      # 3. Upload to Google Drive using Node.js
      - name: Upload to Drive (Diagnostic Mode)
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
        run: |
          npm install googleapis
          node - <<EOF
          const { google } = require('googleapis');
          const fs = require('fs');

          async function syncResume() {
            const credentials = JSON.parse(process.env.GDRIVE_CREDENTIALS);
            // This regex removes any invisible spaces or newlines that might break the ID
            const folderId = process.env.FOLDER_ID ? process.env.FOLDER_ID.replace(/[^a-zA-Z0-9-_]/g, '') : '';
            const fileName = 'resume.pdf';

            console.log('🔍 DEBUG: Starting Health Check...');
            console.log('🔍 DEBUG: FOLDER_ID starts with: "' + folderId.substring(0, 5) + '..." and is ' + folderId.length + ' characters long.');

            if (folderId.length < 15) {
              throw new Error('FOLDER_ID looks way too short to be a real Google Drive ID.');
            }

            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/drive'],
            });

            const drive = google.drive({ version: 'v3', auth });

            // --- HEALTH CHECK: Can the Service Account see the folder? ---
            try {
              console.log('🔍 DEBUG: Testing access to the folder...');
              await drive.files.get({
                fileId: folderId,
                fields: 'id, name',
                supportsAllDrives: true
              });
              console.log('✅ HEALTH CHECK PASSED: Service account can see the folder!');
            } catch (e) {
              console.error('\n❌ CRITICAL FAILURE: The Service Account CANNOT see the folder.');
              console.error('👉 REASON 1: The FOLDER_ID secret is incorrect.');
              console.error('👉 REASON 2: You forgot to share the folder with this email: ' + credentials.client_email);
              console.error('Google API says:', e.message, '\n');
              process.exit(1);
            }
            // -------------------------------------------------------------

            // 1. Search for existing file
            console.log('🔍 DEBUG: Looking for existing resume.pdf...');
            const res = await drive.files.list({
              q: "name = '" + fileName + "' and '" + folderId + "' in parents and trashed = false",
              fields: 'files(id)',
              supportsAllDrives: true,
              includeItemsFromAllDrives: true
            });

            const media = {
              mimeType: 'application/pdf',
              body: fs.createReadStream(fileName),
            };

            const existingFiles = res.data.files;
            
            if (existingFiles && existingFiles.length > 0) {
              const fileId = existingFiles[0].id;
              await drive.files.update({
                fileId: fileId,
                media: media,
                supportsAllDrives: true
              });
              console.log('✅ Updated existing file: ' + fileId);
            } else {
              const fileMetadata = {
                name: fileName,
                parents: [folderId],
              };
              const newFile = await drive.files.create({
                resource: fileMetadata,
                media: media,
                fields: 'id',
                supportsAllDrives: true
              });
              console.log('✅ Created new file: ' + newFile.data.id);
            }
          }

          syncResume().catch(err => {
            console.error('❌ Error Detail:', err.message);
            process.exit(1);
          });
          EOF
