name: Sync Resume to Google Drive
on:
  push:
    branches:
      - main

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Typst to compile your .typ file
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      # 2. Compile main.typ into resume.pdf
      - name: Generate PDF
        run: typst compile main.typ resume.pdf

      # 3. Upload to Google Drive using Node.js (OAuth as user — service accounts
      #    have no storage quota on personal Gmail, only Shared Drives support them).
      #    drive.file scope only sees files the app itself created, so this syncs
      #    to a self-owned file in Drive root rather than a pre-existing folder.
      - name: Upload to Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          npm install googleapis
          node - <<EOF
          const { google } = require('googleapis');
          const fs = require('fs');

          async function syncResume() {
            const fileName = 'resume.pdf';

            const auth = new google.auth.OAuth2(
              process.env.GDRIVE_CLIENT_ID,
              process.env.GDRIVE_CLIENT_SECRET
            );
            auth.setCredentials({ refresh_token: process.env.GDRIVE_REFRESH_TOKEN });

            const drive = google.drive({ version: 'v3', auth });

            console.log('🔍 DEBUG: Looking for existing resume.pdf...');
            const res = await drive.files.list({
              q: "name = '" + fileName + "' and trashed = false",
              fields: 'files(id)',
            });

            const media = {
              mimeType: 'application/pdf',
              body: fs.createReadStream(fileName),
            };

            const existingFiles = res.data.files;

            if (existingFiles && existingFiles.length > 0) {
              const fileId = existingFiles[0].id;
              await drive.files.update({ fileId, media });
              console.log('✅ Updated existing file: ' + fileId);
            } else {
              const newFile = await drive.files.create({
                resource: { name: fileName },
                media,
                fields: 'id',
              });
              console.log('✅ Created new file: ' + newFile.data.id);
            }
          }

          syncResume().catch(err => {
            console.error('❌ Error Detail:', err.message);
            process.exit(1);
          });
          EOF
