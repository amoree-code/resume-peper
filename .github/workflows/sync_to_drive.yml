name: Sync Resume to Google Drive
on:
  push:
    branches:
      - main

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Typst to compile your .typ file
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      # 2. Compile main.typ into resume.pdf
      - name: Generate PDF
        run: typst compile main.typ resume.pdf

      # 3. Upload to Google Drive using Node.js
      - name: Upload to Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}
        run: |
          npm install googleapis
          node - <<EOF
          const { google } = require('googleapis');
          const fs = require('fs');

          async function syncResume() {
            const credentials = JSON.parse(process.env.GDRIVE_CREDENTIALS);
            const folderId = process.env.FOLDER_ID;
            const fileName = 'resume.pdf';

            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/drive.file', 'https://www.googleapis.com/auth/drive'],
            });

            const drive = google.drive({ version: 'v3', auth });

            // 1. Search for existing file in the folder to prevent duplicates
            const res = await drive.files.list({
              q: "name = '" + fileName + "' and '" + folderId + "' in parents and trashed = false",
              fields: 'files(id)',
            });

            const fileMetadata = {
              name: fileName,
              parents: [folderId],
            };
            
            const media = {
              mimeType: 'application/pdf',
              body: fs.createReadStream(fileName),
            };

            const existingFiles = res.data.files;
            
            if (existingFiles && existingFiles.length > 0) {
              // 2. If it exists, update it
              const fileId = existingFiles[0].id;
              await drive.files.update({
                fileId: fileId,
                media: media,
              });
              console.log('✅ Successfully updated ' + fileName + ' (ID: ' + fileId + ')');
            } else {
              // 3. If it doesn't exist, create it
              const newFile = await drive.files.create({
                resource: fileMetadata,
                media: media,
                fields: 'id',
              });
              console.log('✅ Successfully created ' + fileName + ' (ID: ' + newFile.data.id + ')');
            }
          }

          syncResume().catch(err => {
            console.error('❌ Error Detail:', err.message);
            process.exit(1);
          });
          EOF
